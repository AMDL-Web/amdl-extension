<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AMDL — Downloads</title>
    <link rel="icon" href="../icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect width="32" height="32" rx="8" fill="#0a0a0a"/><rect x="6.5" y="13" width="4" height="12" rx="2" fill="#fb7185"/><rect x="11.8" y="7" width="4" height="18" rx="2" fill="#fbbf24"/><rect x="17.1" y="16" width="4" height="9" rx="2" fill="#34d399"/><rect x="22.4" y="10" width="4" height="15" rx="2" fill="#818cf8"/><rect x=".5" y=".5" width="31" height="31" rx="7.5" fill="none" stroke="#ffffff" stroke-opacity="0.2"/></svg>
        <h1>AMDL</h1>
      </div>
      <div class="topbar-actions">
        <span id="mode-badge" class="badge">Loading…</span>
        <button id="open-options" class="icon-btn" title="Open Options" aria-label="Open Options"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
      </div>
    </header>

    <main id="queue-list" class="queue-list"></main>

    <footer class="footer">
      <span id="queue-summary" class="summary">No downloads</span>
      <button id="clear-finished" class="text-btn" type="button">Clear finished</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
