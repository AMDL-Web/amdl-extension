[package]
name = "temari-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Minimal wasm32 FairPlay SAMPLE-AES decryptor wrapping vendored Temari v0.5.1 core."

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
